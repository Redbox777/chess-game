<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шахматы - Мультиплеер</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Шахматы</h1>
            <div id="room-info" style="margin-top: 10px; color: #666;"></div>
        </header>
        <div class="login-form" id="login-form">
            <input type="text" id="username" placeholder="Введите ваше имя" maxlength="20">
            <button id="join-btn">Присоединиться</button>
        </div>
        <main id="game-area" style="display: none;">
            <div class="board-container">
                <div id="board"></div>
            </div>
            <div class="controls">
                <button id="hint-btn" class="btn-hint">💡 Подсказать ход</button>
                <div id="hint-text" class="hint-text"></div>
            </div>
            <div class="chat-container">
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input">
                    <input type="text" id="chat-text" placeholder="Сообщение..." maxlength="100">
                    <button id="send-chat">Отправить</button>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.0/stockfish.js"></script>
    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
